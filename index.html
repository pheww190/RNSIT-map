<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>RNSIT in 3D</title>
<meta name="description" content="An interactive 3D map of the RNS Institute of Technology campus, Channasandra, Bengaluru. Search buildings, hostels, canteens and departments, and get walking directions.">
<meta name="theme-color" content="#0f6b5c">
<meta property="og:type" content="website">
<meta property="og:title" content="RNSIT in 3D">
<meta property="og:description" content="An interactive 3D map of the IIT Kanpur campus. Find any building, hostel block, lecture hall or professor's office, and get walking or cycling directions.">
<meta property="og:url" content="https://nisarg3176.github.io/iitk-3d-map/">
<meta property="og:image" content="https://nisarg3176.github.io/iitk-3d-map/preview.jpg?v=3">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://nisarg3176.github.io/iitk-3d-map/preview.jpg?v=3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;600;700&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --glass: rgba(255,255,255,.78);
    --glass-b: rgba(255,255,255,.9);
    --ink:#1d2a24; --ink2:#55645c; --accent:#0f6b5c; --gold:#e9b44c;
    --lbl-bg: rgba(255,255,255,.88); --lbl-ink:#23302a; --lbl-b: rgba(0,0,0,.06);
  }
  body.night{
    --glass: rgba(18,24,40,.72); --glass-b: rgba(255,255,255,.12);
    --ink:#eef2ff; --ink2:#a9b3cc; --accent:#f2c46d;
    --lbl-bg: rgba(16,22,38,.78); --lbl-ink:#f4ead2; --lbl-b: rgba(255,214,140,.25);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#cfe3ee;font-family:Outfit,system-ui,sans-serif;color:var(--ink)}
  body.night{background:#0a1020}
  canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
  #labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
  .lbl{position:absolute;left:0;top:0;white-space:nowrap;font:500 12px/1 Outfit,sans-serif;
    padding:6px 10px;border-radius:999px;background:var(--lbl-bg);color:var(--lbl-ink);
    border:1px solid var(--lbl-b);box-shadow:0 2px 10px rgba(0,0,0,.12);
    transform:translate(-9999px,0);opacity:0;transition:opacity .25s;will-change:transform;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  .lbl.show{opacity:1}
  .lbl i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px}
  .lbl.t1{font-weight:600;font-size:13px;padding:7px 12px 7px 10px}
  .lbl.t1 i{width:8px;height:8px;box-shadow:0 0 0 3px rgba(255,255,255,.55)}
  body.night .lbl.t1 i{box-shadow:0 0 0 3px rgba(255,255,255,.14)}
  .lbl.t3{font-size:11px;padding:5px 9px}
  .lbl::after{content:"";position:absolute;left:50%;top:100%;width:2px;height:7px;margin-left:-1px;background:var(--lbl-bg);border-radius:0 0 2px 2px}
  .lbl.lane{background:transparent;border:0;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;padding:2px 4px;
    font:600 10.5px/1 Outfit,sans-serif;letter-spacing:.6px;text-transform:uppercase;color:#4c5a52;
    text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 6px rgba(255,255,255,.9)}
  body.night .lbl.lane{color:#c9d2e6;text-shadow:0 0 3px #0b1222,0 0 6px #0b1222}
  .lbl.lane::after,.lbl.hn::after,.lbl.poi::after,.lbl.blk::after{display:none}
  .lbl.blk{font:600 10.5px/1 Outfit,sans-serif;padding:4px 7px;border-radius:6px}
  .lbl.blk i{width:6px;height:6px;margin-right:5px}
  .lbl.hn{font:600 10px/1 Outfit,sans-serif;padding:3px 6px;border-radius:5px;background:rgba(255,255,255,.92);color:#3b4a42}
  body.night .lbl.hn{background:rgba(16,22,38,.85);color:#e8dcc0}
  .lbl.poi{width:22px;height:22px;padding:0;display:flex;align-items:center;justify-content:center;color:#fff;border:2px solid #fff;font:700 9px/1 Outfit,sans-serif}
  .lbl.poi svg{width:13px;height:13px}
  .lbl.feat{font-weight:700}
  .lbl.feat b{display:inline-flex;align-items:center;margin-right:5px;vertical-align:-2px;color:#e0262f}
  .lbl.feat b svg{width:13px;height:13px}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.55)}50%{box-shadow:0 0 0 6px rgba(255,255,255,0)}}
  #vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse 75% 70% at 50% 46%,transparent 55%,rgba(28,40,24,.26) 100%);transition:background .8s}
  body.night #vig{background:radial-gradient(ellipse 75% 70% at 50% 46%,transparent 45%,rgba(2,4,12,.55) 100%)}
  body.hide-labels #labels{display:none}

  .ui{position:fixed;z-index:5}
  #title{top:calc(14px + env(safe-area-inset-top));left:calc(14px + env(safe-area-inset-left));
    padding:12px 16px 11px;border-radius:16px;background:var(--glass);border:1px solid var(--glass-b);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 6px 24px rgba(0,0,0,.12);transition:background .6s,color .6s}
  #title h1{margin:0;font:700 22px/1.05 "Josefin Sans",sans-serif;letter-spacing:.2px}
  #title h1 span{color:var(--gold)}
  #title p{margin:5px 0 0;font-size:12px;color:var(--ink2)}

  #viewCtl{position:fixed;z-index:4;right:calc(18px + env(safe-area-inset-right));bottom:calc(18px + env(safe-area-inset-bottom));display:flex;gap:8px;align-items:center}
  #viewCtl .pill{position:static}
  #viewBtn b{font:700 13px Outfit,sans-serif;letter-spacing:.02em}
  #viewBtn button{gap:5px}
  body.flat #lockBtn{display:none}
  body.walking #viewCtl{display:none}
  #lockBtn button{gap:7px}
  #lockBtn .lk-on{display:none} #lockBtn button.on .lk-on{display:block} #lockBtn button.on .lk-off{display:none}
  @media (max-width:720px){ #viewCtl{bottom:auto;top:calc(188px + env(safe-area-inset-top));right:calc(12px + env(safe-area-inset-right));flex-direction:column} #lockBtn span,#viewBtn span{display:none} #lockBtn button,#viewBtn button{padding:9px} #viewBtn button{min-width:38px;justify-content:center} }
  body.walking #lockBtn{display:none}
  #dock{left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom));display:flex;gap:8px;align-items:center}
  .pill{display:flex;padding:4px;border-radius:999px;background:var(--glass);border:1px solid var(--glass-b);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 6px 24px rgba(0,0,0,.15);transition:background .6s}
  .pill button{appearance:none;border:0;background:transparent;color:var(--ink);font:500 14px Outfit,sans-serif;
    padding:9px 16px;border-radius:999px;cursor:pointer;display:flex;align-items:center;gap:7px;transition:background .3s,color .3s}
  .pill button{white-space:nowrap}
  .pill button.on{background:var(--accent);color:#fff}
  body.night .pill button.on{color:#1a1406}
  .pill button svg{width:16px;height:16px}
  .round button{padding:9px 12px}

  #hint{left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom));font-size:12.5px;
    padding:8px 14px;border-radius:999px;background:var(--glass);color:var(--ink2);border:1px solid var(--glass-b);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:opacity .8s;white-space:nowrap}
  #hint.gone{opacity:0;pointer-events:none}

  #loader{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    background:radial-gradient(ellipse at 50% 40%,#e9f3e0 0%,#bcd9a5 100%);transition:opacity .9s}
  #loader.done{opacity:0;pointer-events:none}
  #loader h2{margin:0;font:700 30px "Josefin Sans",sans-serif;color:#24402f}
  #loader p{margin:0;font-size:14px;color:#4c6a55}
  .bar{width:180px;height:4px;border-radius:4px;background:rgba(0,0,0,.08);overflow:hidden}
  .bar i{display:block;height:100%;width:30%;background:#2f7d5b;border-radius:4px;animation:slide 1.1s ease-in-out infinite}
  @keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(330%)}}
  .glass{background:var(--glass);border:1px solid var(--glass-b);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 6px 24px rgba(0,0,0,.15);transition:background .6s,color .6s}
  #bSky .tm{font-variant-numeric:tabular-nums;font-weight:600}
  #bSky .live{width:7px;height:7px;border-radius:50%;background:#e0464b;box-shadow:0 0 0 0 rgba(224,70,75,.6);animation:lv 2s infinite;display:none}
  #bSky.islive .live{display:inline-block}
  @keyframes lv{0%{box-shadow:0 0 0 0 rgba(224,70,75,.55)}70%{box-shadow:0 0 0 7px rgba(224,70,75,0)}100%{box-shadow:0 0 0 0 rgba(224,70,75,0)}}
  #skyPanel{left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translate(-50%,12px);width:min(440px,calc(100vw - 20px));
    border-radius:20px;padding:14px 16px 12px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s,background .6s}
  #skyPanel.open{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
  .sp-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .sp-h{font:600 11px Outfit;letter-spacing:.9px;text-transform:uppercase;color:var(--ink2);margin:12px 0 6px}
  #spTime{font:700 26px/1 "Josefin Sans",sans-serif;font-variant-numeric:tabular-nums}
  #spSun{font-size:12px;color:var(--ink2);margin-top:3px}
  #tslider{width:100%;margin:12px 0 2px;-webkit-appearance:none;appearance:none;height:8px;border-radius:8px;outline:none;
    background:linear-gradient(90deg,#0d1530 0%,#1d2a55 20%,#f39a63 27%,#7fb4e2 36%,#5d9fd6 50%,#7fb4e2 64%,#f39a63 72%,#1d2a55 80%,#0d1530 100%)}
  #tslider::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;border:3px solid var(--accent);box-shadow:0 2px 8px rgba(0,0,0,.3);cursor:grab}
  #tslider::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid var(--accent);cursor:grab}
  .ticks{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink2);padding:0 2px}
  .seg{display:flex;flex-wrap:wrap;gap:6px}
  .seg button,.chip{appearance:none;border:1px solid var(--glass-b);background:rgba(127,127,127,.1);color:var(--ink);font:500 13px Outfit,sans-serif;
    padding:7px 11px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:background .2s,color .2s;white-space:nowrap}
  .seg button svg{width:15px;height:15px}
  .seg button.on,.chip.on{background:var(--accent);color:#fff;border-color:transparent}
  body.night .seg button.on,body.night .chip.on{color:#1a1406}
  #bLive.on{background:#e0464b;color:#fff}
  .tog{display:flex;align-items:center;gap:9px;margin-top:12px;font-size:13px;cursor:pointer;user-select:none}
  .tog input{display:none} .tog span{width:34px;height:20px;border-radius:20px;background:rgba(127,127,127,.35);position:relative;transition:background .2s}
  .tog span::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s}
  .tog input:checked+span{background:var(--accent)} .tog input:checked+span::after{transform:translateX(14px)}

  #searchWrap{top:calc(14px + env(safe-area-inset-top));right:calc(14px + env(safe-area-inset-right));width:380px}
  #sbox{display:flex;align-items:center;gap:8px;border-radius:16px;padding:0 8px 0 14px;height:46px}
  #sbox svg{width:18px;height:18px;flex:none;color:var(--ink2)}
  #sq{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--ink);font:500 15px Outfit,sans-serif;height:100%}
  #sq::placeholder{color:var(--ink2)}
  #sclear{border:0;background:transparent;color:var(--ink2);cursor:pointer;padding:6px;display:none;font-size:18px;line-height:1}
  #results{margin-top:6px;border-radius:16px;overflow:hidden;display:none;max-height:min(360px,50vh);overflow-y:auto}
  #results.open{display:block}
  .res{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;font-size:14px}
  .res i{width:9px;height:9px;border-radius:50%;flex:none}
  .res small{margin-left:auto;color:var(--ink2);font-size:11.5px;white-space:nowrap}
  .res.sel,.res:hover{background:rgba(127,127,127,.16)}
  .res b{font-weight:700;color:var(--accent)}
  .nores{padding:12px 14px;font-size:13px;color:var(--ink2)}
  #bDir{border:0;background:var(--accent);color:#fff;width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
  body.night #bDir{color:#1d1a12}
  #bDir svg{width:17px;height:17px;color:inherit}
  #dirPanel{display:none;border-radius:18px;padding:12px 12px 10px}
  body.dir #dirPanel{display:block} body.dir #sbox,body.dir #results,body.dir #chips{display:none!important}
  .dp-head{display:flex;align-items:center;justify-content:space-between;margin:0 2px 10px;font-size:15px}
  .dp-head button{border:0;background:transparent;color:var(--ink2);font-size:22px;line-height:1;cursor:pointer;padding:0 4px}
  .dp-in{display:flex;align-items:center;gap:8px}
  .dp-dots{display:flex;flex-direction:column;align-items:center;gap:3px;width:14px;flex:none}
  .dp-dots i{width:11px;height:11px;border-radius:50%;display:block}
  .dp-dots i.s{background:#fff;border:3px solid #1f9d55} .dp-dots i.e{background:#e0262f;border-radius:50% 50% 50% 0;transform:rotate(-45deg)}
  .dp-dots span{width:2px;height:22px;background:repeating-linear-gradient(var(--ink2) 0 3px,transparent 3px 6px);opacity:.6}
  .dp-fields{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
  .dp-fields input{width:100%;height:38px;border-radius:11px;border:1px solid rgba(127,127,127,.28);background:rgba(127,127,127,.1);color:var(--ink);padding:0 11px;font:500 14px Outfit,sans-serif;outline:0}
  .dp-fields input:focus{border-color:var(--accent)}
  .dp-fields input::placeholder{color:var(--ink2)}
  #dSwap{border:0;background:rgba(127,127,127,.14);color:var(--ink);width:34px;height:34px;border-radius:10px;cursor:pointer;flex:none;display:flex;align-items:center;justify-content:center}
  #dSwap svg{width:17px;height:17px}
  #dRes{margin-top:8px;border-radius:12px;overflow:hidden;display:none;max-height:min(300px,40vh);overflow-y:auto;background:rgba(127,127,127,.08)}
  #dRes.open{display:block}
  #dOut{margin-top:10px;display:none} #dOut.open{display:block}
  .d-go-row{display:flex;gap:8px;margin-top:8px}
  .d-go{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:9px 10px;border-radius:12px;border:1px solid rgba(127,127,127,.3);background:transparent;color:var(--ink);font:600 13px Outfit,sans-serif;cursor:pointer}
  .d-go.pri{background:var(--accent);color:#fff;border-color:transparent}
  .d-go svg{width:16px;height:16px}
  #guide{position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top));width:min(460px,calc(100vw - 20px));z-index:30;display:none;gap:8px;flex-direction:column}
  body.guiding #guide{display:flex}
  body.guiding .ui, body.guiding #dirPanel, body.guiding #viewCtl, body.guiding .lbl, body.guiding #card{display:none!important}
  .g-top{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:18px;background:#0f6b5c;color:#fff;box-shadow:0 8px 26px rgba(0,0,0,.25)}
  .g-top i{width:42px;height:42px;flex:none;display:flex;align-items:center;justify-content:center} .g-top i svg{width:40px;height:40px}
  .g-txt b{display:block;font:700 17px/1.25 Outfit,sans-serif} .g-txt b em{font-style:normal} .g-txt small{display:block;margin-top:3px;font:500 13px Outfit,sans-serif;opacity:.85}
  .g-bar{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 14px;border-radius:14px;background:var(--panel,rgba(255,255,255,.92));color:var(--ink);box-shadow:0 6px 18px rgba(0,0,0,.18);font:600 13px Outfit,sans-serif;align-self:center}
  .g-bar button{border:0;border-radius:10px;padding:7px 12px;font:700 13px Outfit,sans-serif;cursor:pointer;background:rgba(127,127,127,.15);color:var(--ink)}
  .g-bar #gStop{background:#d0372b;color:#fff}
  body.guide-live #gPause{display:none}
  .d-modes{display:flex;gap:6px;margin-bottom:8px}
  .d-modes button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;height:34px;border-radius:10px;border:1px solid rgba(127,127,127,.25);background:transparent;color:var(--ink);font:600 13px Outfit,sans-serif;cursor:pointer}
  .d-modes button svg{width:16px;height:16px}
  .d-modes button.on{background:var(--accent);border-color:var(--accent);color:#fff} body.night .d-modes button.on{color:#1d1a12}
  .d-modes .d-share{flex:0 0 40px}
  .d-sum{display:flex;align-items:baseline;gap:10px;padding:10px 12px;border-radius:12px;background:rgba(127,127,127,.1);flex-wrap:wrap}
  .d-sum b{font-size:20px;font-weight:700;color:var(--accent)}
  .d-sum span{font-size:13px;color:var(--ink2);display:inline-flex;align-items:center;gap:4px}
  .d-sum span svg{width:15px;height:15px}
  .d-via{font-size:12px;color:var(--ink2);margin:6px 4px 2px}
  #dSteps{margin-top:6px;max-height:min(330px,42vh);overflow-y:auto;padding-right:2px}
  .d-st{display:flex;align-items:center;gap:10px;padding:8px 6px;border-radius:10px;cursor:pointer;font-size:13.5px;line-height:1.3}
  .d-st:hover,.d-st.sel{background:rgba(127,127,127,.14)}
  .d-st i{width:28px;height:28px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;background:rgba(127,127,127,.15);font-style:normal}
  .d-st i svg{width:16px;height:16px}
  .d-st em{font-style:normal;font-weight:600}
  .d-st small{margin-left:auto;color:var(--ink2);font-size:12px;white-space:nowrap;padding-left:6px}
  .d-msg{font-size:13px;color:var(--ink2);padding:8px 4px}
  .rpin{position:fixed;left:0;top:0;pointer-events:none;z-index:2;will-change:transform;display:none}
  .rpin.s{width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:#fff;border:4px solid #1f9d55;box-shadow:0 2px 8px rgba(0,0,0,.35)}
  .rpin.e{width:26px;height:26px;margin:-30px 0 0 -13px;border-radius:50% 50% 50% 0;background:#e0262f;transform-origin:center;box-shadow:0 2px 8px rgba(0,0,0,.35)}
  .rpin.e::after{content:"";position:absolute;left:8px;top:8px;width:10px;height:10px;border-radius:50%;background:#fff}
  .d-tog{display:none;margin-left:auto;border:0;background:transparent;color:var(--accent);font:600 13px Outfit,sans-serif;cursor:pointer;padding:0}
  @media (max-width:720px){ #dSteps{max-height:34vh;display:none} #dOut.steps #dSteps{display:block} .d-tog{display:inline} .d-via{display:none} #dOut.steps .d-via{display:block} .dp-fields input{height:36px} #dirPanel{padding:10px 10px 8px} .dp-head{margin-bottom:6px} }
  /* place / person card */
  #card{left:calc(14px + env(safe-area-inset-left));top:calc(96px + env(safe-area-inset-top));width:340px;max-height:calc(100vh - 200px);border-radius:18px;padding:14px 14px 12px;display:none;overflow:hidden;flex-direction:column}
  #card.open{display:flex}
  .c-head{display:flex;align-items:flex-start;gap:10px}
  .c-head h2{margin:0;font-size:17px;font-weight:700;line-height:1.25}
  .c-kind{font-size:12.5px;color:var(--ink2);margin-top:3px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .c-kind i{width:8px;height:8px;border-radius:50%;display:inline-block}
  .c-x{margin-left:auto;border:0;background:transparent;color:var(--ink2);font-size:22px;line-height:1;cursor:pointer;padding:0 2px}
  .c-body{overflow-y:auto;margin-top:10px;padding-right:2px}
  .c-acts{display:flex;gap:6px;margin:2px 0 10px;flex-wrap:wrap}
  .c-acts button{display:flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:10px;border:1px solid rgba(127,127,127,.25);background:transparent;color:var(--ink);font:600 13px Outfit,sans-serif;cursor:pointer}
  .c-acts button svg{width:15px;height:15px}

function windowTextures(){
  const N=16, S=32, W=N*S;
  const a=document.createElement('canvas'); a.width=a.height=W; const ca=a.getContext('2d');
  const e=document.createElement('canvas'); e.width=e.height=W; const ce=e.getContext('2d');
  ca.fillStyle='#ffffff'; ca.fillRect(0,0,W,W); ce.fillStyle='#000'; ce.fillRect(0,0,W,W);
  const wr=R;
  for(let i=0;i<N;i++) for(let j=0;j<N;j++){
    const x=i*S, y=(N-1-j)*S; // j = floor from bottom
    const wx=x+6, wy=y+7, ww=S-12, wh=S-15;
    ca.fillStyle='#e9e6e0'; ca.fillRect(x,y+S-4,S,4); // slab line
    ca.fillStyle='#4a5866'; ca.fillRect(wx,wy,ww,wh);
    ca.fillStyle='#7d8e9c'; ca.fillRect(wx,wy,ww,3);
    ca.fillStyle='#d8d4cc'; ca.fillRect(wx+ww/2-1,wy,2,wh);
    const r=wr();
    if(r<0.42){ const warm=wr(); const l=0.55+wr()*0.45;
      ce.fillStyle = warm<0.8 ? `rgba(255,${190+wr()*30|0},${110+wr()*40|0},${l})` : `rgba(215,230,255,${l})`;
      if(r<0.36){ const sh=(i*7+j*3)%5; // only some rooms are lit, and not all the same way (curtains, half-open, a lamp)
        if(sh===0) ce.fillRect(wx,wy,ww,wh); else if(sh===1) ce.fillRect(wx,wy,ww/2-1,wh); else if(sh===2) ce.fillRect(wx,wy+wh*0.45,ww,wh*0.55);
        else if(sh===3) ce.fillRect(wx+ww/2+1,wy,ww/2-1,wh); else { ce.globalAlpha=0.6; ce.fillRect(wx,wy,ww,wh); ce.globalAlpha=1; }
        ce.fillStyle='rgba(0,0,0,.5)'; ce.fillRect(wx+ww/2-1,wy,2,wh); } }
  }
  const t1=new THREE.CanvasTexture(a), t2=new THREE.CanvasTexture(e);
  for(const t of [t1,t2]){ t.wrapS=t.wrapT=THREE.RepeatWrapping; t.anisotropy=renderer.capabilities.getMaxAnisotropy(); }
  t1.colorSpace=THREE.SRGBColorSpace; t2.colorSpace=THREE.SRGBColorSpace;
  return [t1,t2];
}

  if(perf.n>=90||(now-perf.w0>6000&&perf.n>=8)){ if(perf.slow/perf.n>0.6) setLite(liteLvl+1); perf.n=perf.slow=0; } }
try{ const sv=+localStorage.getItem('iitk3d.lite')||0; const q=new URLSearchParams(location.search).get('lite'); const lv=q!=null?(+q||0):sv; if(q==='0'){ localStorage.removeItem('iitk3d.lite'); perf.t0=1e12; } if(lv) setLite(Math.min(2,lv),true); }catch(e){}
function frame(now){
  requestAnimationFrame(frame);
  if(now-lastRender<FRAME_MS && !dirty) return;
  if(lastRender) watchPerf(now,now-lastRender);
  const dt=Math.min(0.1,(now-last)/1000); last=now; const t=now/1000; TIME.value=t;
  if(timeAnim){ const k=Math.min(1,(now-timeAnim.t0)/timeAnim.dur); simMs=timeAnim.from+(timeAnim.to-timeAnim.from)*ease(k); atmosDirty=true;
    if(k>=1){ if(timeAnim.goLive){ live=true; simMs=Date.now(); } timeAnim=null; } }
  else if(live && now-liveT>20000){ simMs=Date.now(); liveT=now; atmosDirty=true; }
  if(stepWx(dt)) atmosDirty=true; stepSeason(dt);
  if(catAnim){ const k=Math.min(1,(now-catAnim.t0)/500); CATU.uCatAmt.value=catAnim.from+(catAnim.to-catAnim.from)*ease(k); if(k>=1) catAnim=null; dirty=true; }
  if(atmosDirty){ atmosDirty=false; applyAtmos(); dirty=true; }
  if(fly){ const k=Math.min(1,(now-fly.t0)/fly.dur), e=ease(k);
    controls.target.lerpVectors(fly.fromT,fly.toT,e); camera.position.lerpVectors(fly.fromP,fly.toP,e); dirty=true; if(k>=1) fly=null; }
  if(wk.on){ stepWalk(dt,now); dirty=true; }
  else if(guide){ stepGuide(now,dt); controls.update(); }
  else {
    if(!angleLock && !flat2D && !controls.autoRotate && !fly && !focusLbl && !catFilter && !routeMesh.visible && now-idleT>30000){ controls.autoRotate=true; controls.autoRotateSpeed=0.25; }
    controls.update(); if(controls.autoRotate) dirty=true;
    clampTarget();
  }
  if(dirty) shadowDirty=true;
  updateSun();
  if(shadowDirty){ renderer.shadowMap.needsUpdate=true; shadowDirty=false; }
  // ambient animation
  CLU.uDrift.value=t*4.5; CLU.uN.value=wxCur.clouds; clouds.visible=wxCur.clouds>0.3;
  rainLines.visible=wxCur.rain>0.02; if(rainLines.visible){ const ru=rainMat.uniforms; ru.uA.value=wxCur.rain*.42;
    const near=wk.on; ru.uB.value.set(near?70:240,near?50:200,near?70:240);
    const f=new THREE.Vector3(); camera.getWorldDirection(f); ru.uO.value.copy(camera.position).addScaledVector(f,near?20:110); }
  stepLife(dt,t);
  if(marker.visible){ const s=marker.userData.s, k=((now-marker.userData.t0)/1400)%1; marker.children[0].scale.setScalar(s*(1+k*.35)); marker.children[1].scale.setScalar(s*.9); mkMat.opacity=.9*(1-k*.6); }
  sky.position.copy(camera.position); refreshEnv(now);
  if(bloom.strength>0.01) composer.render(); else renderer.render(scene,camera);
  updateLabels(); stepNav(now); stepPins();
  dirty=false; lastRender=now;
}
renderer.shadowMap.autoUpdate=false;
applyAtmos();
document.getElementById('loader').classList.add('done');
requestAnimationFrame(frame);
flyTo(HOME_T,HOME_OFF,3200);
window.__ready=true;
window.__api={startGuide:(m)=>startGuide(m),guide:()=>guide&&{s:guide.s,total:guide.total,i:guide.i},set2D:(...q)=>set2D(...q),lite:()=>liteLvl,setLayer:(...a)=>setLayer(...a),NAV,CLOSED,isClosed,choose,dFrom,dTo,searchItems,runNav,nav,flyTo,camera,controls,THREE,kick,scene,sky,clouds,skyU,agents,lifeM,carNet,enterWalk,exitWalk,setCat,wk,labels,
  setTime:(h)=>{ live=false; timeAnim=null; simMs=istDay0(simMs)+h*3600000; atmosDirty=true; },
  setWeather:(w)=>{ weather=w; Object.assign(wxCur,{...WX[w],gc:C(WX[w].gc),cc:C(WX[w].cc)}); atmosDirty=true; },
  setSeason:(s)=>{ seasonMode=s; const S=SEASONS[curSeason()]; SEA.grassMul.value.set(...S.gm); SEA.leafMul.value.set(...S.lm); SEA.dry.value=S.dry; SEA.turn.value=S.turn; SEA.bloom.value=S.bloom; SEA.turnA.value.set(S.ta); SEA.turnB.value.set(S.tb); atmosDirty=true; },
  search:(q)=>{ sq.value=q; renderResults(); if(resList[0]) pick(resList[0]); },
  setView:(t,off)=>{ fly=null; controls.target.copy(t); camera.position.copy(t).add(off); controls.update(); kick(); }};
</script>
